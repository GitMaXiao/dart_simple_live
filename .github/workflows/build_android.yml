name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_mobile:
        description: '构建手机/平板端 (simple_live_app)'
        required: true
        type: boolean
        default: true
      build_tv:
        description: '构建电视端 (simple_live_tv_app)'
        required: true
        type: boolean
        default: true
      split_per_abi:
        description: '按 CPU 架构拆分 APK (arm64-v8a / armeabi-v7a / x86_64)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - master
      - main
      - dev
    tags:
      - 'v*'
      - 'dev_v*'
      - 'android_v*'
      - 'release_*'
  pull_request:
    branches:
      - master
      - main

jobs:
  # ==========================================
  # 任务 1: 手机 / 平板端独立并行构建
  # ==========================================
  build-phone:
    name: Build Phone APKs
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mobile }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          cache: true

      - name: 检查环境版本并启用 Native Assets 特性
        run: |
          flutter config --enable-native-assets
          flutter --version
          java -version

      - name: 配置手机端签名证书 (可选)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > simple_live_app/android/keystore.jks
            echo "storeFile=keystore.jks" > simple_live_app/android/key.properties
            echo "storePassword=$STORE_PASSWORD" >> simple_live_app/android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> simple_live_app/android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> simple_live_app/android/key.properties
            echo "已配置手机端 Release 签名"
          else
            echo "未配置自定义 Secrets，自动使用仓库内置的固定 Release 签名证书打包 (确保每次签名永久一致)"
          fi

      - name: 获取手机端依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 构建手机端通用 APK (Universal)
        run: |
          cd simple_live_app
          flutter build apk --release

      - name: 构建手机端分架构 APK (Split per ABI)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.split_per_abi }}
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: 整理手机端 APK 产物
        run: |
          mkdir -p output_phone_apks
          if [ -d "simple_live_app/build/app/outputs/flutter-apk" ]; then
            find simple_live_app/build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} output_phone_apks/ \;
            [ -f "output_phone_apks/app-release.apk" ] && mv output_phone_apks/app-release.apk output_phone_apks/simple_live_app-universal-release.apk || true
            [ -f "output_phone_apks/app-arm64-v8a-release.apk" ] && mv output_phone_apks/app-arm64-v8a-release.apk output_phone_apks/simple_live_app-arm64-v8a-release.apk || true
            [ -f "output_phone_apks/app-armeabi-v7a-release.apk" ] && mv output_phone_apks/app-armeabi-v7a-release.apk output_phone_apks/simple_live_app-armeabi-v7a-release.apk || true
            [ -f "output_phone_apks/app-x86_64-release.apk" ] && mv output_phone_apks/app-x86_64-release.apk output_phone_apks/simple_live_app-x86_64-release.apk || true
          fi
          echo "=== 手机端 APK 列表 ==="
          ls -lh output_phone_apks/

      - name: 上传手机端 APK 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Phone-APKs
          path: output_phone_apks/*.apk
          retention-days: 14

  # ==========================================
  # 任务 2: 电视 TV 端独立并行构建
  # ==========================================
  build-tv:
    name: Build TV APKs
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_tv }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          cache: true

      - name: 检查环境版本并启用 Native Assets 特性
        run: |
          flutter config --enable-native-assets
          flutter --version
          java -version

      - name: 配置 TV 端签名证书 (可选)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
        run: |
          if [ -n "$TV_KEYSTORE_BASE64" ]; then
            echo "$TV_KEYSTORE_BASE64" | base64 --decode > simple_live_tv_app/android/keystore.jks
            echo "storeFile=keystore.jks" > simple_live_tv_app/android/key.properties
            echo "storePassword=$TV_STORE_PASSWORD" >> simple_live_tv_app/android/key.properties
            echo "keyPassword=$TV_KEY_PASSWORD" >> simple_live_tv_app/android/key.properties
            echo "keyAlias=$TV_KEY_ALIAS" >> simple_live_tv_app/android/key.properties
            echo "已配置 TV 专属 Release 签名"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > simple_live_tv_app/android/keystore.jks
            echo "storeFile=keystore.jks" > simple_live_tv_app/android/key.properties
            echo "storePassword=$STORE_PASSWORD" >> simple_live_tv_app/android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> simple_live_tv_app/android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> simple_live_tv_app/android/key.properties
            echo "TV 端复用通用 Release 签名"
          else
            echo "未配置自定义 Secrets，自动使用仓库内置的固定 Release 签名证书打包 (确保每次签名永久一致)"
          fi

      - name: 获取 TV 端依赖
        run: |
          cd simple_live_tv_app
          flutter pub get

      - name: 构建 TV 端通用 APK (Universal)
        run: |
          cd simple_live_tv_app
          flutter build apk --release

      - name: 构建 TV 端分架构 APK (Split per ABI)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.split_per_abi }}
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      - name: 整理 TV 端 APK 产物
        run: |
          mkdir -p output_tv_apks
          if [ -d "simple_live_tv_app/build/app/outputs/flutter-apk" ]; then
            find simple_live_tv_app/build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} output_tv_apks/ \;
            [ -f "output_tv_apks/app-release.apk" ] && mv output_tv_apks/app-release.apk output_tv_apks/simple_live_tv-universal-release.apk || true
            [ -f "output_tv_apks/app-arm64-v8a-release.apk" ] && mv output_tv_apks/app-arm64-v8a-release.apk output_tv_apks/simple_live_tv-arm64-v8a-release.apk || true
            [ -f "output_tv_apks/app-armeabi-v7a-release.apk" ] && mv output_tv_apks/app-armeabi-v7a-release.apk output_tv_apks/simple_live_tv-armeabi-v7a-release.apk || true
            [ -f "output_tv_apks/app-x86_64-release.apk" ] && mv output_tv_apks/app-x86_64-release.apk output_tv_apks/simple_live_tv-x86_64-release.apk || true
          fi
          echo "=== TV 端 APK 列表 ==="
          ls -lh output_tv_apks/

      - name: 上传 TV 端 APK 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-TV-APKs
          path: output_tv_apks/*.apk
          retention-days: 14

  # ==========================================
  # 任务 3: 发布 Release (仅在 Tag 触发时聚合发布)
  # ==========================================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-phone, build-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载手机端产物
        uses: actions/download-artifact@v4
        with:
          name: SimpleLive-Phone-APKs
          path: release_apks/

      - name: 下载 TV 端产物
        uses: actions/download-artifact@v4
        with:
          name: SimpleLive-TV-APKs
          path: release_apks/

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
